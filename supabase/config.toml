# Supabase CLI project configuration. Run `supabase init` only for projects
# without this file; this config is deliberately minimal and uses local defaults.
project_id = "taste-of-zimbabwe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[analytics]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
